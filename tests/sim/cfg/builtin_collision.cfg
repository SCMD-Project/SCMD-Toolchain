// sim_cs2_builtin_precedes_alias: real CS2 builtins (kill/help/version)
// win over same-name aliases; scmdsim refuses to create those aliases.
alias kill "echoln BAD_KILL_ALIAS"
alias help "echoln BAD_HELP_ALIAS"
alias version "echoln BAD_VERSION_ALIAS"
kill
help
version
echoln BUILTIN_COLLISION_OK
